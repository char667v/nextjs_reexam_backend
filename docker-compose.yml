services:
  web: # Flask app/ my BACEND with Flask “instruction book” framework 
    build: # because we are building our own image (not using a pre-made one) like with mariadb and phpmyadmin
      context: . # the root of the project (where the Dockerfile is located)
      dockerfile: Dockerfile
    container_name: ww_reeksamen_flask
    depends_on: # start the mariadb before the Flask app starts
      - mariadb
    ports:
      - 80:80
    volumes:
      - .:/app # my backend folder on the Mac (.) and /app in the Flask container are the same files, so code changes show up without rebuilding
    env_file:
      - .env
 
  mariadb: # the database (where all the actual data lives)
    image: mariadb:10.6.20
    container_name: ww_reeksamen_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ww_reeksamen
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 3312:3306 # Port 3312 was chosen to avoid conflicts with any existing MySQL/MariaDB installations on the host machine. 
 
  phpmyadmin: # the visual tool to inspect what's inside mariadb (only for me, the developer - not part of the app itself)
    image: phpmyadmin/phpmyadmin
    container_name: ww_reeksamen_phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 8081:80
 
volumes:
  mariadb_data:




